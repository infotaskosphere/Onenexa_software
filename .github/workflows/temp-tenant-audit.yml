name: Temporary Tenant Scope Audit

on:
  push:
    branches:
      - audit/error-free-cleanup-20261002

permissions:
  contents: read

jobs:
  tenant-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory direct collection access
        run: |
          set +e
          echo "===== db/raw collection access ====="
          git grep -h -o -E '(db|raw_db)\.[A-Za-z_][A-Za-z0-9_]*' -- 'backend/**/*.py' ':!backend/tests/**' ':!backend/test_*.py' | sort -u || true

          echo "===== raw database helper sites ====="
          git grep -n -E '_raw_db\(|raw_db\b' -- 'backend/**/*.py' ':!backend/tests/**' ':!backend/test_*.py' | head -n 400 || true

          echo "===== TenantAwareCollection coverage list ====="
          sed -n '/TENANT_COLLECTIONS = {/,/}/p' backend/tenant_runtime.py || true

          echo "===== collection names referenced in tenant wrapper ====="
          grep -n 'self\._name ==\|self\._name !=\|self\._name in' backend/tenant_runtime.py || true
