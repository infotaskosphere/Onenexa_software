name: OneNexa Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - feature/master-console
    paths:
      - "desktop/**"
      - "backend/**"
      - "frontend/**"
      - "package.json"
      - "requirements.txt"
      - ".github/workflows/onenexa-windows-installer.yml"

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out OneNexa
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify password hashing dependencies before packaging
        run: |
          python -c "from passlib.context import CryptContext; import passlib.handlers.bcrypt; import bcrypt; print('passlib bcrypt handler import OK; bcrypt', bcrypt.__version__)"
          python -c "from passlib.context import CryptContext; CryptContext(schemes=['bcrypt'], deprecated='auto'); print('bcrypt CryptContext initialization OK')"

      - name: Package FastAPI backend for Windows
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --name onenexa-backend
          --distpath build/backend-dist
          --workpath build/pyinstaller
          --specpath build/pyinstaller
          --paths .
          --collect-submodules backend
          --collect-data backend
          --collect-all passlib
          --collect-all bcrypt
          --hidden-import passlib.handlers.bcrypt
          --hidden-import bcrypt
          backend/run.py

      - name: Install frontend and Electron dependencies
        run: npm install --no-audit --no-fund

      - name: Build React frontend
        run: npm run build:frontend

      - name: Create Windows icon from the existing OneNexa logo
        run: |
          python -c "from pathlib import Path; from PIL import Image; Path('build').mkdir(parents=True, exist_ok=True); image = Image.open('frontend/public/onenexa-logo.png').convert('RGBA'); image.save('build/onenexa.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)]); print('Created build/onenexa.ico from the existing OneNexa logo')"

      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: OneNexa-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
