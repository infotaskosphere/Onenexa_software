name: Temporary Tenant AST Audit

on:
  push:
    branches:
      - audit/error-free-cleanup-20261002

permissions:
  contents: read

jobs:
  tenant-ast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare database collections to tenant allowlist
        run: |
          python - <<'PY'
          import ast, pathlib, re
          src = pathlib.Path("backend/tenant_runtime.py").read_text()
          m = re.search(r"TENANT_COLLECTIONS = \\{(.*?)\\n\\}", src, re.S)
          names = set(re.findall(r'"([^"]+)"', m.group(1)))
          names |= {"companies"}

          refs = {}
          for path in pathlib.Path("backend").rglob("*.py"):
              if "/tests/" in str(path) or path.name.startswith("test_"):
                  continue
              try:
                  tree = ast.parse(path.read_text(), filename=str(path))
              except Exception:
                  continue
              for node in ast.walk(tree):
                  name = None
                  if isinstance(node, ast.Attribute) and isinstance(node.value, ast.Name) and node.value.id == "db":
                      name = node.attr
                  elif isinstance(node, ast.Subscript) and isinstance(node.value, ast.Name) and node.value.id == "db":
                      sl = node.slice
                      if isinstance(sl, ast.Constant) and isinstance(sl.value, str):
                          name = sl.value
                  if name:
                      refs.setdefault(name, []).append((str(path), node.lineno))

          missing = sorted(k for k in refs if k not in names)
          print("TENANT_COLLECTIONS:", len(names))
          print("REFERENCED db collections:", len(refs))
          print("\nUNSCOPED db COLLECTIONS:")
          for name in missing:
              print(f"\n{name} ({len(refs[name])} references)")
              for path, line in refs[name][:12]:
                  print(f"  {path}:{line}")
          print("\nSCOPED collections:")
          print(", ".join(sorted(set(refs) & names)))
          PY
