name: Temporary Callsite Audit

on:
  push:
    branches:
      - audit/error-free-cleanup-20261002

permissions:
  contents: read

jobs:
  callsites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find cache and learning call sites
        run: |
          for pattern in             "save_dashboard_cache"             "get_dashboard_cache"             "save_learning"             "save_processing_history"             "save_validation"             "save_itc_record"             "log_learning_event"             "save_financial_validation"; do
            echo "===== $pattern ====="
            git grep -n -F "$pattern" -- 'backend/**/*.py' ':!backend/tests/**' ':!backend/test_*.py' || true
          done
