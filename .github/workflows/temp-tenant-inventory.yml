name: Temporary Tenant Inventory

on:
  push:
    branches:
      - audit/error-free-cleanup-20261002

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory backend db collections
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import json

          tenant_source = Path("backend/tenant_runtime.py").read_text()
          tenant_tree = ast.parse(tenant_source)
          tenant = set()

          for node in ast.walk(tenant_tree):
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "TENANT_COLLECTIONS":
                          if isinstance(node.value, (ast.Set, ast.List, ast.Tuple)):
                              for item in node.value.elts:
                                  if isinstance(item, ast.Constant) and isinstance(item.value, str):
                                      tenant.add(item.value)

          refs = {}
          for path in Path("backend").rglob("*.py"):
              if "tests" in path.parts or path.name.startswith("test_"):
                  continue
              try:
                  tree = ast.parse(path.read_text(), filename=str(path))
              except Exception:
                  continue

              for node in ast.walk(tree):
                  name = None
                  if isinstance(node, ast.Attribute) and isinstance(node.value, ast.Name) and node.value.id == "db":
                      name = node.attr
                  elif isinstance(node, ast.Subscript) and isinstance(node.value, ast.Name) and node.value.id == "db":
                      value = node.slice
                      if isinstance(value, ast.Constant) and isinstance(value.value, str):
                          name = value.value
                  if name:
                      refs.setdefault(name, []).append((str(path), node.lineno))

          result = {name: refs[name] for name in sorted(refs) if name not in tenant}
          print(json.dumps(result, indent=2))
          PY
