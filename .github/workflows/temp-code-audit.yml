name: Temporary Code Audit

on:
  pull_request:
    branches:
      - feature/master-console
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Static backend error scan
        run: ruff check backend --select E9,F821,F822,F823 --output-format concise

  frontend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Reference audit
        working-directory: .
        run: |
          for pattern in "models_banking import router" "models_extended import router" "FinixAIWorkspace" "EmployeeMaster" "IdentixAttendance" "WebsiteBuilderConsole" "check_permission_and_visibility" "get_team_user_ids"; do
            echo "===== $pattern ====="
            git grep -n -F "$pattern" -- ':!*.map' || true
          done
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Unused-code scan
        run: npx --yes knip --no-progress --include files,exports,types
