name: Temporary Code Audit

on:
  push:
    branches:
      - audit/error-free-cleanup-20261002

permissions:
  contents: read

jobs:
  frontend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Static unused-code scan
        run: npx --yes knip --no-progress --include files,exports,types
