<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="An all-in-one compliance, accounting, and task management platform with dynamic license-gated module navigation." />
    <meta property="og:title" content="OneNexa" />
    <meta property="og:description" content="An all-in-one compliance, accounting, and task management platform with dynamic license-gated module navigation." />
    <link rel="stylesheet" href="/suite-top-card.css" />
    <style id="task-management-header-ui">
      /* Scoped to the Tasks route only. Structural selectors avoid Tailwind-colon escaping. */
      html.task-management-route h1[data-task-header-title="true"] {
        white-space: nowrap !important;
        overflow: visible !important;
        text-overflow: clip !important;
      }
      html.task-management-route [data-task-header-actions="true"] {
        display: grid !important;
        grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
        gap: 8px !important;
        width: 100% !important;
        min-width: 0 !important;
        align-items: stretch !important;
      }
      html.task-management-route [data-task-header-actions="true"] > button {
        width: 100% !important;
        min-width: 0 !important;
        justify-content: center !important;
        white-space: nowrap !important;
      }
      html.task-management-route [data-task-header-actions="true"] > .task-header-divider {
        display: none !important;
      }
      html.task-management-route [data-task-header-actions="true"] > .task-header-notification {
        display: none !important;
      }
      @media (min-width: 1024px) {
        html.task-management-route [data-task-header-row="true"] {
          display: grid !important;
          grid-template-columns: minmax(280px, 0.75fr) minmax(0, 1.25fr) !important;
          column-gap: 64px !important;
          row-gap: 24px !important;
          align-items: center !important;
        }
        html.task-management-route [data-task-header-title-wrap="true"] {
          min-width: 280px !important;
        }
      }
      @media (max-width: 1023px) {
        html.task-management-route [data-task-header-row="true"] {
          row-gap: 20px !important;
        }
        html.task-management-route [data-task-header-actions="true"] {
          grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        }
      }
    </style>
    <title>OneNexa</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      (() => {
        const syncTaskRouteClass = () => {
          document.documentElement.classList.toggle('task-management-route', location.pathname === '/tasks');
        };
        syncTaskRouteClass();
        window.addEventListener('popstate', syncTaskRouteClass);
        document.addEventListener('click', () => window.setTimeout(syncTaskRouteClass, 0), true);
      })();
    </script>
    <script>
      (() => {
        const HEADER_TITLE = 'Task Management';
        let scheduled = false;
        let observer = null;
        const markAndLayout = () => {
          scheduled = false;
          if (location.pathname !== '/tasks') {
            document.documentElement.classList.remove('task-management-route');
            return;
          }
          document.documentElement.classList.add('task-management-route');
          const title = Array.from(document.querySelectorAll('h1')).find((el) => el.textContent.trim() === HEADER_TITLE);
          if (!title) return;
          title.setAttribute('data-task-header-title', 'true');
          const titleWrap = title.parentElement;
          const row = titleWrap?.parentElement;
          if (!titleWrap || !row) return;
          titleWrap.setAttribute('data-task-header-title-wrap', 'true');
          row.setAttribute('data-task-header-row', 'true');
          const actions = Array.from(row.children).find((el) => el !== titleWrap && el.querySelector?.('button'));
          if (!actions) return;
          actions.setAttribute('data-task-header-actions', 'true');
          Array.from(actions.children).forEach((child) => {
            if (child.classList?.contains('h-8') && child.classList?.contains('w-px')) child.classList.add('task-header-divider');
            const bell = child.matches?.('button') && child.querySelector?.('svg.lucide-bell');
            if (bell) child.classList.add('task-header-notification');
          });
        };
        const schedule = () => {
          if (scheduled) return;
          scheduled = true;
          window.setTimeout(markAndLayout, 0);
        };
        const start = () => {
          if (observer) observer.disconnect();
          observer = new MutationObserver(schedule);
          observer.observe(document.getElementById('root') || document.body, { childList: true, subtree: true });
          schedule();
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true });
        else start();
        window.addEventListener('popstate', schedule);
        document.addEventListener('click', schedule, true);
      })();
    </script>
    <script>
      (() => {
        const id = 'taskosphere-backup-sidebar-link';
        let scheduled = false;
        const sync = () => {
          scheduled = false;
          let user = null;
          try {
            const raw = localStorage.getItem('user') || sessionStorage.getItem('user');
            user = raw ? JSON.parse(raw) : null;
          } catch (_) {}
          const existing = document.getElementById(id);
          const isAdmin = String(user?.role || '').toLowerCase() === 'admin';
          const isApproved = user?.permissions?.can_view_backup_restore === true;
          if (!user || (!isAdmin && !isApproved) || location.pathname === '/login') {
            if (existing) existing.remove();
            return;
          }
          const settingsItem = document.querySelector('a[href="/settings/whatsapp"]');
          if (!settingsItem) {
            if (existing) existing.remove();
            return;
          }
          const link = existing || document.createElement('a');
          link.id = id;
          link.href = '/settings/backup';
          link.setAttribute('aria-label', 'Backup & Restore');
          link.title = 'Backup & Restore';
          link.className = settingsItem.className;
          if (!existing) {
            link.innerHTML = '<span aria-hidden="true" class="flex-shrink-0 transition-colors h-4 w-4 text-slate-400">▣</span><span class="font-medium text-sm whitespace-nowrap tracking-tight truncate">Backup &amp; Restore</span>';
          }
          const isActive = location.pathname === '/settings/backup' || location.pathname.startsWith('/settings/backup/');
          const nextClass = settingsItem.className + (isActive ? ' bg-white/[0.09] text-white' : '');
          if (link.className !== nextClass) link.className = nextClass;
          if (!existing || link.previousElementSibling !== settingsItem) settingsItem.parentNode.insertBefore(link, settingsItem.nextSibling);
        };
        const scheduleSync = (delay = 0) => {
          if (scheduled) return;
          scheduled = true;
          window.setTimeout(sync, delay);
        };
        scheduleSync(100);
        window.addEventListener('load', () => scheduleSync(100));
        document.addEventListener('click', (event) => {
          if (event.target?.closest?.('a[href^="/settings"], button[id^="nav-tab-settings"]')) scheduleSync(100);
        }, true);
        window.addEventListener('storage', () => scheduleSync(100));
        window.addEventListener('popstate', () => scheduleSync(100));
      })();
    </script>
    <script>
      (() => {
        /* The reference design changes only the top card. Mark the existing
           first dashboard card rather than replacing any dashboard markup.

           FIX (2026-09-16): '/dashboard' (Taskosphere) used to map to
           'taskosphere' here, which asynchronously (via MutationObserver +
           setTimeout) added the .suite-top-hero class and forced the hero
           into suite-top-card.css's white-background/navy-text look — on
           top of the hero's own inline blue gradient + white text. Because
           this ran a tick after first paint, the hero visibly flashed from
           blue to white on every load, and the forced navy text fought
           with taskosphere-header-colors.css over the same element.
           Taskosphere's hero keeps its own deliberate blue design, so it
           is no longer included here. Finix and People Matrix are
           unaffected and keep the light-card treatment as before. */
        let scheduled = false;
        const moduleForPath = () => {
          const path = location.pathname;
          if (path === '/finix-dashboard') return 'finix';
          if (path === '/people-matrix') return 'people-matrix';
          return null;
        };
        const syncSuiteHero = () => {
          scheduled = false;
          const module = moduleForPath();
          document.querySelectorAll('.suite-top-hero').forEach((el) => el.classList.remove('suite-top-hero'));
          if (!module) return;
          const main = document.querySelector('main');
          const root = main?.firstElementChild;
          const hero = root?.firstElementChild;
          if (!hero) return;
          hero.classList.add('suite-top-hero');
          hero.dataset.suiteModule = module;
        };
        const schedule = () => {
          if (scheduled) return;
          scheduled = true;
          window.setTimeout(syncSuiteHero, 0);
        };
        const observer = new MutationObserver(schedule);
        observer.observe(document.getElementById('root') || document.body, { childList: true, subtree: true });
        window.addEventListener('popstate', schedule);
        document.addEventListener('click', schedule, true);
        schedule();
      })();
    </script>
    <script>
      (() => {
        /* People Matrix greeting follows the user's current local time and
           refreshes automatically without changing the rest of the card. */
        let scheduled = false;
        const greeting = () => {
          const hour = new Date().getHours();
          if (hour < 12) return 'Good Morning';
          if (hour < 17) return 'Good Afternoon';
          if (hour < 21) return 'Good Evening';
          return 'Working Late';
        };
        const syncGreeting = () => {
          scheduled = false;
          if (location.pathname !== '/people-matrix') return;
          const title = Array.from(document.querySelectorAll('main h1')).find((el) => /^(Good Morning|Good Afternoon|Good Evening|Working Late),/.test(el.textContent.trim()));
          if (!title) return;
          const current = title.textContent.trim();
          const match = current.match(/^(Good Morning|Good Afternoon|Good Evening|Working Late),(.*)$/);
          if (!match) return;
          title.textContent = `${greeting()},${match[2]}`;
        };
        const schedule = () => {
          if (scheduled) return;
          scheduled = true;
          window.setTimeout(syncGreeting, 0);
        };
        const observer = new MutationObserver(schedule);
        observer.observe(document.getElementById('root') || document.body, { childList: true, subtree: true, characterData: true });
        window.addEventListener('popstate', schedule);
        document.addEventListener('click', schedule, true);
        window.setInterval(schedule, 60000);
        schedule();
      })();
    </script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
