##############################################################################
# render.yaml — Taskosphere Commercial service definitions
#
# Production architecture:
#   Backend  -> Python / FastAPI (backend/server.py via backend.run)
#   Frontend -> React / Vite static site (frontend/)
#   WA Hub   -> Node / Baileys bridge (wa-bridge/)
##############################################################################

services:

  # ── Backend (Python / FastAPI) ─────────────────────────────────────────────
  - type: web
    name: tasko-commercial-backend
    env: python
    rootDir: .
    buildCommand: bash build.sh
    startCommand: python -m backend.run
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: taskosphere_commercial
      - key: JWT_SECRET
        generateValue: true
      - key: ENV_MODE
        value: production
      - key: SAAS_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: SAAS_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SAAS_BOOTSTRAP_COMPANY_NAME
        value: Taskosphere Commercial
      - key: SAAS_BOOTSTRAP_PACKAGE_ID
        value: professional
      - key: SAAS_SESSION_TTL_DAYS
        value: "30"
      - key: WA_BRIDGE_URL
        value: https://tasko-commercial-wa-bridge.onrender.com
    healthCheckPath: /health

  # ── Frontend (React / Vite static site) ────────────────────────────────────
  - type: web
    name: tasko-commercial-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://tasko-commercial-backend.onrender.com
    headers:
      - path: /assets/*.css
        name: Content-Type
        value: text/css; charset=utf-8
      - path: /assets/*.js
        name: Content-Type
        value: application/javascript; charset=utf-8
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── WhatsApp Bridge (Node.js / Baileys) ───────────────────────────────────
  - type: web
    name: tasko-commercial-wa-bridge
    env: node
    rootDir: wa-bridge
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: BACKEND_URL
        value: https://tasko-commercial-backend.onrender.com
    disk:
      name: wa-sessions
      mountPath: /opt/render/project/src/sessions
      sizeGB: 1
